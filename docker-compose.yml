# Фиксированное имя проекта: от него зависят имена томов (embedding-test_ollama_data, ...)
name: embedding-test

services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG}
    cpus: ${OLLAMA_CPUS}
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Одноразовый контейнер: скачивает модели эмбеддингов из .env.
  # Уже скачанные модели пропускаются — так стек стартует и без интернета.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG}
    environment:
      OLLAMA_HOST: ollama:11434
      MODELS: ${OLLAMA_EMBED_MODELS}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for m in $$(echo "$$MODELS" | tr ',' ' '); do
          if ollama show "$$m" >/dev/null 2>&1; then
            echo "$$m: уже скачана"
          else
            ollama pull "$$m"
          fi
        done
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG}
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  embedder-api:
    image: embedding-test/embedder-api:local
    build:
      context: ./src/EmbedderApi
    env_file: .env
    ports:
      - "${API_PORT}:8080"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
